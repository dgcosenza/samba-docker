services:
  samba:
    image: dgcosenza/samba:latest
    container_name: samba
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    network_mode: host
    env_file:
      - ./samba.env
    environment:
      TZ: UTC
      FAIL_FAST: "1"
      NETBIOS_DISABLE: "1"
      AVAHI_DISABLE: "1"
      WSDD2_DISABLE: "1"
      SAMBA_CONF_LOG_LEVEL: "1"
      SAMBA_CONF_MAP_TO_GUEST: Never
      SAMBA_CONF_SERVER_STRING: Samba Server
    volumes:
      - ./smb.conf:/etc/samba/smb.conf:ro
      - ./shares/data:/shares/data
    healthcheck:
      test: ["CMD-SHELL", "smbclient -L 127.0.0.1 -N >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 256M
